name: User story
description: A unit of user-facing value from the product backlog
title: "[US] <short title>"
labels: ["user-story"]
body:
  - type: markdown
    attributes:
      value: |
        Stories must satisfy the **Definition of Ready** in
        [`docs/02-agile-planning.md`](../../docs/02-agile-planning.md#7-definition-of-ready)
        before they move to the Ready column.
  - type: input
    id: story-id
    attributes:
      label: Backlog ID
      description: The identifier from the product backlog
      placeholder: US-09
    validations: { required: true }
  - type: textarea
    id: story
    attributes:
      label: Story
      value: |
        **As a** <role>
        **I want** <capability>
        **So that** <benefit>
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Given/When/Then, one block per criterion. These are what the tests assert.
      value: |
        - **AC-1** — *Given* ... *when* ... *then* ...
        - **AC-2** — *Given* ... *when* ... *then* ...
    validations: { required: true }
  - type: dropdown
    id: epic
    attributes:
      label: Epic
      options:
        - E1 Access and Identity
        - E2 Master Data
        - E3 Attendance Capture
        - E4 Approval Workflow
        - E5 Summary Dashboard
        - E6 Delivery Pipeline
    validations: { required: true }
  - type: dropdown
    id: priority
    attributes:
      label: MoSCoW priority
      options: ["Must", "Should", "Could", "Won't (this release)"]
    validations: { required: true }
  - type: dropdown
    id: points
    attributes:
      label: Story points
      options: ["1", "2", "3", "5", "8", "13"]
    validations: { required: true }
  - type: input
    id: testid
    attributes:
      label: Selenium hooks
      description: "`data-testid` values any UI element this story adds (Definition of Ready, condition 6)"
      placeholder: "data-testid=search-form, data-testid=search-results"
