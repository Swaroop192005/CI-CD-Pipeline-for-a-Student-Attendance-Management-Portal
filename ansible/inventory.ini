# Inventory for the Student Attendance Management Portal.
#
# The portal node runs the container workload. It is addressed over a local
# connection here because the target in this project IS the Docker host; for a
# remote server, replace ansible_connection with ansible_host/ansible_user and
# nothing else in the playbooks changes.
[portal]
portal-node ansible_connection=local

[portal:vars]
ansible_python_interpreter=/usr/bin/python3
