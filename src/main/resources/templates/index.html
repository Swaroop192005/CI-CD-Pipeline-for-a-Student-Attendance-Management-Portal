<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Attendance Management Portal</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar"><span class="brand" th:text="${applicationName}">Attendance Portal</span></header>
<main>
  <h1>Student Attendance Management Portal</h1>
  <p class="sub">Attendance capture with a role-based approval workflow.</p>
  <div class="card" data-testid="status-card">
    <h2>Application status</h2>
    <table>
      <tr><td>Status</td><td><span class="badge b-APPROVED" data-testid="status">RUNNING</span></td></tr>
      <tr><td>Active profile</td><td class="mono" data-testid="profile" th:text="${activeProfile}">default</td></tr>
      <tr><td>Minimum attendance threshold</td>
          <td class="mono" data-testid="threshold" th:text="${minimumAttendancePercent} + '%'">75%</td></tr>
    </table>
  </div>
  <div class="card">
    <p><a class="btn" th:href="@{/login}" data-testid="go-to-login">Sign in to the portal</a></p>
    <p class="sub" style="margin-top:12px;margin-bottom:0">
      Health probe: <a th:href="@{/actuator/health}" data-testid="health-link">/actuator/health</a>
    </p>
  </div>
</main>
</body>
</html>
