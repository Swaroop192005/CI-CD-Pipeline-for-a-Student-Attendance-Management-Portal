<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="~{fragments/layout :: head('Search records')}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar}"></header>
<main>
  <h1>Search attendance records</h1>
  <p class="sub">Every filter is optional and they combine.</p>

  <div class="card">
    <form class="inline" method="get" th:action="@{/attendance/search}">
      <div>
        <label for="rollNumber">Roll number</label>
        <input type="text" id="rollNumber" name="rollNumber" th:value="${rollNumber}"
               placeholder="22CS003" data-testid="search-roll">
      </div>
      <div>
        <label for="courseId">Course</label>
        <select id="courseId" name="courseId" data-testid="search-course">
          <option value="">Any</option>
          <option th:each="c : ${courses}" th:value="${c.id}" th:text="${c.code}"
                  th:selected="${c.id == selectedCourseId}">CS301</option>
        </select>
      </div>
      <div>
        <label for="from">From</label>
        <input type="date" id="from" name="from" th:value="${from}" data-testid="search-from">
      </div>
      <div>
        <label for="to">To</label>
        <input type="date" id="to" name="to" th:value="${to}" data-testid="search-to">
      </div>
      <div>
        <label for="state">Workflow state</label>
        <select id="state" name="state" data-testid="search-state">
          <option value="">Any</option>
          <option th:each="s : ${states}" th:value="${s}" th:text="${s}"
                  th:selected="${s == selectedState}">DRAFT</option>
        </select>
      </div>
      <button class="btn" type="submit" data-testid="search-submit">Search</button>
      <a class="btn secondary" th:href="@{/attendance/search}" data-testid="search-reset">Reset</a>
    </form>
  </div>

  <div class="card" th:if="${searched}">
    <h2 th:text="${records.totalElements} + ' matching record(s)'">0 matching records</h2>
    <table data-testid="search-results">
      <thead>
        <tr><th>Roll no.</th><th>Student</th><th>Course</th>
            <th>Session date</th><th>Status</th><th>Workflow</th></tr>
      </thead>
      <tbody>
        <tr th:each="r : ${records.content}">
          <td class="mono" th:text="${r.student.rollNumber}">22CS001</td>
          <td th:text="${r.student.fullName}">Name</td>
          <td class="mono" th:text="${r.course.code}">CS301</td>
          <td class="mono" th:text="${r.sessionDate}">2026-10-01</td>
          <td><span class="badge" th:classappend="'b-' + ${r.status}" th:text="${r.status}">PRESENT</span></td>
          <td><span class="badge" th:classappend="'b-' + ${r.workflowState}" th:text="${r.workflowState}">DRAFT</span></td>
        </tr>
        <tr th:if="${records.totalElements == 0}">
          <td colspan="6" class="empty" data-testid="search-empty">No matching records</td>
        </tr>
      </tbody>
    </table>
    <div class="pager" th:if="${totalPages > 1}">
      <span th:text="'Page ' + (${currentPage} + 1) + ' of ' + ${totalPages}">Page 1 of 1</span>
    </div>
  </div>
</main>
</body>
</html>
