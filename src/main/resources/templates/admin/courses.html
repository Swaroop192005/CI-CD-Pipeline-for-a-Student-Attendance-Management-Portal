<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="~{fragments/layout :: head('Courses')}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar}"></header>
<main>
  <h1>Courses</h1>
  <p class="sub">Master data. Attendance is recorded against these courses.</p>
  <div class="card">
    <table data-testid="courses-table">
      <thead><tr><th>Code</th><th>Title</th><th>Total sessions</th></tr></thead>
      <tbody>
        <tr th:each="c : ${courses}" th:attr="data-testid='course-' + ${c.code}">
          <td class="mono" th:text="${c.code}">CS301</td>
          <td th:text="${c.title}">Software Engineering</td>
          <td th:text="${c.totalSessions}">40</td>
        </tr>
        <tr th:if="${#lists.isEmpty(courses)}">
          <td colspan="3" class="empty">No courses defined.</td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>
