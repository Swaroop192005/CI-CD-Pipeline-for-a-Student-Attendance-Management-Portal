# =============================================================================
# Student Attendance Management Portal - base configuration
#
# Every value the pipeline needs to vary between environments is read from an
# environment variable with a sensible local default, so the same artefact runs
# unchanged on a developer machine, in a Docker container and on the Ansible
# provisioned node (US-19 AC-19.2).
# =============================================================================
spring.application.name=Student Attendance Management Portal

# --- Server -----------------------------------------------------------------
server.port=${SERVER_PORT:8080}
server.servlet.context-path=${CONTEXT_PATH:/}
server.shutdown=graceful

# --- Database (H2 file mode; swap the URL for PostgreSQL without a rebuild) ---
# H2 2.x rejects AUTO_SERVER=TRUE combined with DB_CLOSE_ON_EXIT=FALSE
# ("Feature not supported"), and neither is needed here: a single JVM owns
# the file and shutdown is handled by server.shutdown=graceful.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/sampdb}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# H2 web console is a development aid only; disabled unless the dev profile is on
spring.h2.console.enabled=${H2_CONSOLE:false}
spring.h2.console.path=/h2-console

# --- Business rules ---------------------------------------------------------
# Statutory minimum attendance. Configurable, never hard-coded (Task 1, A4 / AC-15.4).
samp.attendance.minimum-percent=${ATTENDANCE_THRESHOLD:75}

# --- Actuator ---------------------------------------------------------------
# Only health and info are exposed: these drive the Docker HEALTHCHECK and the
# Ansible post-deploy verification (S13, AC-24.3). Nothing else is published.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true

# --- Logging ----------------------------------------------------------------
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.samp.attendance=${APP_LOG_LEVEL:INFO}
